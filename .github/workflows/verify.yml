name: Verify platforms

# Runs the live test suites on every platform GitHub can host: iOS simulator,
# Android emulator, Linux and Windows. Manual only: each run builds the Rust core
# and talks to the public resolvers. The maintainer runs it before a release and
# links the run from the README.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job: ios, android, linux or windows (empty = all)"
        required: false
        default: ""

# Keyed by the `only` input too, so `-f only=linux` and `-f only=windows` run
# side by side instead of the second cancelling the first.
concurrency:
  group: verify-${{ github.ref }}-${{ inputs.only }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ios-simulator:
    name: iOS simulator (dns)
    if: inputs.only == '' || inputs.only == 'ios'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
      - name: Live tests on the simulator
        run: ./gradlew :dns:iosSimulatorArm64Test -Pdns.simulator="iPhone 16"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-simulator-results
          path: '**/build/test-results/**/*.xml'

  android-emulator:
    name: Android emulator (dns, dns-okhttp)
    if: inputs.only == '' || inputs.only == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" > /dev/null
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Live tests on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-results
          path: '**/build/outputs/androidTest-results/**/*.xml'

  linux:
    name: Linux x64 (dns)
    if: inputs.only == '' || inputs.only == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - name: Live tests (Kotlin/Native linuxX64 and JVM)
        run: ./gradlew :dns:linuxX64Test :dns:jvmTest :dns-okhttp:jvmTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-results
          path: '**/build/test-results/**/*.xml'

  windows:
    name: Windows x64 (dns)
    if: inputs.only == '' || inputs.only == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      # The Rust core as dnskmp.dll inside a JVM, which is what the published jar ships.
      - name: JVM live tests (dnskmp.dll)
        shell: bash
        run: ./gradlew :dns:jvmTest :dns-okhttp:jvmTest
      - name: Live tests (Kotlin/Native mingwX64)
        shell: bash
        run: ./gradlew :dns:mingwX64Test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-results
          path: '**/build/test-results/**/*.xml'
